<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
        <title>BombIt Mission</title>
        <style>
            html { height: 100%; }
            body { height: 100%; overflow: hidden; margin: 0; padding: 0; }
            #bombit-mission-canvas {background: url(assets/img/background.jpg) 50% 50% no-repeat; background-size: cover;}
            #bombit-mission-canvas.ingame {background: url(assets/img/water_background.png); background-size: auto;}
            canvas { width: 100% !important; }
            /*#bombit-mission-canvas {width: 700px; height: 510px; margin: 0 auto;}*/
            /*#bombit-mission-canvas {width: 100%; height: 100%;}*/

            .debug-window {
                position: fixed;
                top: 0;
                bottom: 0;
                right: 0;
                width: 200px;
                overflow: hidden;
                font-family: monospace;
                margin: 0;
                padding: 0;
                transition: right 0.5s;
                z-index: 2000;
            }

            .debug-window.hidden {
                right: -180px;
            }

            .debug-window ul,
            .debug-window ul li {
                list-style-type: none;
                margin: 0;
                padding: 0;
            }

            .debug-window ul {
                overflow: auto;
                position: absolute;
                left: 0;
                right: 0;
                top: 2em;
                bottom: 0;
            }

            .debug-window ul li {
                padding-left: 1em;
            }

            .debug-window .toggle {
                cursor: pointer;
                display: block;
                padding: 0.25em;
                width: 1em;
            }

            .debug-window .toggle,
            .debug-window,
            .debug-window .header {
                border-left: 1px solid #888;
                border-top: 1px solid #888;
                border-right: 1px solid #000;
                border-bottom: 1px solid #000;
                background: #444;
                color: #fff;
                opacity: 0.9;
            }
        </style>
        <!-- Include the Spilgames HTML5 API -->
        <!-- <script type="text/javascript" src="http://cdn.gameplayer.io/api/js/game.js"></script> -->
        <script type="text/javascript" src="mockSDK.js"></script>
        <script src="azerion-libs.js" defer></script>
        <script src="azIntegration-ads-wrapper.min.js?v=1" defer></script>
    </head>
    <body onLoad="initGame();">
        <div id="bombit-mission-canvas"></div>

        <script src="js/bombit.js"></script>

        <!-- declare the 'SpilData' object and the app ID property -->
        <!-- Load the HTML5 API -->
        <script type="text/javascript">
        function initGame() {
            var SpilData = {
                id: '576742227280291436' // You receive this value from Spil Games
            };

            if (!window.GameAPI){// || iMG.bombit.device.ie) {
                iMG.bombit.state.start('Boot');
            }
            else {
                GameAPI.loadAPI (function (apiInstance) {
                    iMG.bombit.apiInstance = apiInstance;
                    iMG.bombit.state.start('Boot');
                }, SpilData);
            }
        }
        </script>
    </body>
</html>
